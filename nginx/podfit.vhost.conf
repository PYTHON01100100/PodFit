# === podfit -> 127.0.0.1:8510 ===
# Replace YOUR_DOMAIN and the ssl_certificate paths with your own before use.
server { listen 80; server_name YOUR_DOMAIN; return 301 https://$host$request_uri; }
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;
    ssl_certificate     /etc/ssl/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/ssl/YOUR_DOMAIN/privkey.pem;
    client_max_body_size 10M;
    location / {
        proxy_pass http://127.0.0.1:8510;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        # /api/recommend reads dozens of model configs from the Hub on a cold
        # cache; give it room rather than cutting the request off at 60s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
